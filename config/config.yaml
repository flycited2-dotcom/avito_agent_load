# ВАЖНО: Avito блокирует один и тот же товар в нескольких городах как «повторное размещение».
# Поэтому — ОДИН город (одно объявление на товар). Охват по региону — через Avito Доставку.
profile:
  name: conditioners
  source: oasis_db
  grouping: series
  feed_path: feed_out/feed.xml
  public_feed_path: "/opt/oasis/staticfiles/avito-feed.xml"
  manual_stop_path: state/manual-stop-main.json
  source_options:
    excluded_product_patterns: ['(?i)\bгенератор\b']
    excluded_device_types: [Генераторы]

cities:
  - {id: "simferopol", name: "Симферополь", avito_location: "Республика Крым, Симферополь"}
pricing:
  rounding: none
  default_markup_pct: 10
  min_margin_abs: 0       # ровно +10% к доступной оптовой цене
  rules:
    # 04.09.2026: ещё +15% к рассчитанной цене РусКлимата, кроме кондиционеров.
    - match: {source: rusklimat}
      exclude_category_ids: [2, 6, 7]
      markup_pct: 10
      post_markup_pct: 15
feed:
  max_active_ads: 250       # не обрезать перечисленные владельцем складские группы
  # Защита last-good: сетевой/DB-сбой не имеет права заменить рабочий фид пустым.
  # Намеренное массовое снятие ниже этого порога требует отдельного изменения конфига.
  min_active_ads: 40
  max_drop_fraction: 0.35
  base_tags:
    Category: "Бытовая техника"
    GoodsType: "Климатическое оборудование"
    AdType: "Товар приобретен на продажу"
    Condition: "Новое"
    ListingFee: "Package"
  overridable_tags: [Category, GoodsType]
  tag_order:
    - Category
    - GoodsType
    - AdType
    - Condition
    - ProductType
    - GoodsSubType
    - HeatingType
    - HeatingSubType
    - PriceFor
    - Brand
    - RadiatorType
    - Material
    - SectionQuantity
    - Vendor
    - AirConditionerType
    - AirConditionerSubType
    - ListingFee
  # ProductType = «Тип климатического оборудования» — ТОЛЬКО из списка Avito.
  # Для всех наших кондиционеров (сплит/мобильные/полупром) валидно одно значение:
  product_type_default: "Кондиционеры и запчасти"
  product_type_map: {}
  # AirConditionerType = «Вид кондиционера»; AirConditionerSubType = «Тип кондиционера».
  # Значения — лучшая догадка, уточняются по валидатору/шаблону «Кондиционеры».
  # Вид кондиционера (AirConditionerType): Сплит-система | Мобильный | Фанкойл
  ac_type_map:
    2: "Сплит-система"
    6: "Сплит-система"
    7: "Мобильный"
  # Тип кондиционера (AirConditionerSubType): сплит→Настенный; мобильный→Напольный.
  # Для полупрома (6) тип зависит от модели (Кассетный/Канальный/…) — уточнить полный список.
  ac_subtype_map:
    2: "Настенный"
    6: "Кассетный"
    7: "Напольный"
  # Производитель (Vendor) — справочник Avito. Наш бренд -> имя в Avito.
  vendor_map:
    "EXPERTAIR by ZILON": "Zilon"
  # Бренды, которых нет в справочнике Avito → НЕ публикуем (вместо ошибки модерации).
  vendor_skip: []
content:
  title_max: 50
  description_max: 7000
  condition_notice: "Состояние: новое. Товар не использовался, в заводской упаковке."
  stop_words: ["скидка только сегодня", "звоните"]
  # Готовые тексты описаний на серию (manifest: series_key → файл). Переопределяют автогенерацию,
  # живая таблица цен дописывается автоматически. Пусто/нет файла = автогенерация.
  descriptions_manifest: "avito-descriptions/manifest.json"
  # Тест ссылки на сайт: текст-футер + список серий (key), к которым его добавляем (для теста — одна).
  # Avito по правилам не любит внешние ссылки — проверяем на одном объявлении, не блокнут ли.
  website_link: ""
  website_link_keys: []
catalog:
  # Только фактический склад Симферополя. Категория 2 дополнительно ограничена
  # инверторной технологией; тепловые насосы совпадают с витриной SplitHome.
  report_category_ids: [2, 15, 19, 21, 22, 24, 26, 27, 30, 37, 40, 46, 117, 118, 119]
  # Товары поставщика «Русский климат» не публикуются ни в одной категории.
  excluded_sources: ["rusklimat"]
  inverter_only_category_ids: [2]
  heat_pump_threshold: -20
  include_jac_snapshot: true   # свежий снимок обновлённого JAC-скрапера; дедупликация убирает повторы с БД
  exclude_title_patterns: ["%мульти%", "%виброопор%", "%охладитель воздуха%", "%зимний комплект%", "%зимн%", "%комплект зимний%", "%колонка газовая%", "%водонагреватель проточный%", "%датчик co2%", "%нагревательный элемент%"]
  crimea_warehouse: "Симферополь"
  # Принудительно в фид (минуя наличие БД) — товары под заказ. {nc: {price, series}}; series разводит
  # товары по РАЗНЫМ объявлениям (без series — схлопываются в одну серию).
  force_include: {}
  category_labels:
    2: "Инверторная сплит-система"
    15: "Увлажнитель воздуха"
    19: "Тепловентилятор"
    21: "Электрический конвектор"
    22: "Масляный обогреватель"
    24: "Инфракрасный обогреватель"
    26: "Тепловая пушка"
    27: "Тепловая завеса"
    30: "Накопительный водонагреватель"
    37: "Бризер"
    40: "Вентиляционная установка"
    46: "Рекуператор"
    117: "Отопительный котёл"
    118: "Радиатор отопления"
    119: "Тёплый пол"
  category_tags:
    2: {ProductType: "Кондиционеры и запчасти", GoodsSubType: "Кондиционеры"}
    15: {ProductType: "Увлажнители воздуха"}
    19: {ProductType: "Обогреватели", GoodsSubType: "Тепловентиляторы"}
    21: {ProductType: "Обогреватели", GoodsSubType: "Электрические обогреватели"}
    22: {ProductType: "Обогреватели", GoodsSubType: "Электрические обогреватели"}
    24: {ProductType: "Обогреватели", GoodsSubType: "Электрические обогреватели"}
    26: {ProductType: "Обогреватели", GoodsSubType: "Тепловые пушки"}
    27: {ProductType: "Обогреватели", GoodsSubType: "Тепловые завесы"}
    30: {GoodsType: "Для дома", GoodsSubType: "Водонагреватели"}
    37: {ProductType: "Вентиляционное оборудование"}
    40: {ProductType: "Вентиляционное оборудование"}
    46: {ProductType: "Вентиляционное оборудование"}
    117: {ProductType: "Обогреватели", GoodsSubType: "Котлы"}
    118:
      Category: "Ремонт и строительство"
      GoodsType: "Камины и обогреватели"
      GoodsSubType: "Отопительные системы"
      HeatingType: "Радиаторы отопления и конвекторы"
      HeatingSubType: "Радиаторы"
    119: {ProductType: "Обогреватели", GoodsSubType: "Тёплые полы"}
  heat_pump_tags:
    ProductType: "Обогреватели"
    GoodsSubType: "Тепловые насосы"
  # Масляные радиаторы (22) и накопительные водонагреватели (30) проходят
  # Контент-завод: без готовой уникальной карточки в кандидат не попадают.
  supplier_photo_category_ids: [2, 19, 21, 24, 26, 27, 37, 40, 46, 117, 118, 119]
  # Ручное фото для товаров без фото в БД: {nc_code: URL}. Кладём jpg в /static/manual-photos/.
  manual_photos:
    "НС-1763718": "https://splithome.ru/static/manual-photos/tessey.jpg"   # Ballu Tessey DC 7k (rep)
    "НС-1763719": "https://splithome.ru/static/manual-photos/tessey.jpg"   # Ballu Tessey DC 9k
    "НС-1763720": "https://splithome.ru/static/manual-photos/tessey.jpg"   # Ballu Tessey DC 12k
  # Курирование каталога: список серий (key из avito-series-select.xlsx) для публикации. Пусто = все.
  selected_series: []
# Уникальные карточки от фотоагента: файл avito-cards/{nc_code}.jpg → берётся вместо фото поставщика.
# Снимает блок Avito «повторное размещение» по фото (модели серии у поставщика делят одно фото).
cards:
  enabled: true
  dir: "/opt/oasis/staticfiles/avito-cards"
  base_url: "https://splithome.ru/static/avito-cards"
  exts: [".jpg", ".jpeg", ".png"]
  require_for_publish: true   # публикуем серию только с уникальной карточкой (исключаем блок «дубль фото»)
  max_images: 10              # лимит картинок в объявлении (Avito)
  # 10 серий на ФОТО ПОСТАВЩИКА (несколько фото, без генер-карточки). Многоразмерные, с богатым фотоматериалом.
  supplier_photo_series:
    - "breeze|ultima comfort|elysium inverter"
    - "breeze|royal clima|felicita"
    - "rusklimat|ballu|olympio edge"
    - "breeze|funai|shogun"
    - "daichi|midea|анлимитед"
    - "rusklimat|shuft|tor"
    - "rusklimat|ballu|odyssey pro dc"
    - "breeze|hisense|easy classic a"
    - "breeze|hisense|city dc inverter"
    - "breeze|hitachi|shiratama"
