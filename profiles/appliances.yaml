pricing:
  # Наценки — из «наценки по группам товара.xlsx» (excel-automation, наценки прайса
  # для клиентов): 2–10%. ВОПРОС ВЛАДЕЛЬЦУ: для Avito те же или выше (розница)?
  rounding: none                # опт+2–10% на мелочёвке: округление …90 исказило бы наценку
  default_markup_pct: 5
  min_margin_abs: 0
  rules:
    - {match: {series: "Мультиварки"}, markup_pct: 2}
    - {match: {series: "Измельчители"}, markup_pct: 4}
    - {match: {series: "Духовки настольные"}, markup_pct: 3}
    - {match: {series: "Плитки настольные"}, markup_pct: 2}
    - {match: {series: "Микроволновые печи"}, markup_pct: 2}
    - {match: {series: "Холодильники с нижней морозильной камерой"}, markup_pct: 4}
    - {match: {series: "Холодильники с верхней морозильной камерой"}, markup_pct: 4}
    - {match: {series: "Морозильные камеры"}, markup_pct: 2}
    - {match: {series: "Морозильные лари"}, markup_pct: 2}
    - {match: {series: "Электрические плиты"}, markup_pct: 3}
    - {match: {series: "Плиты с газовой духовкой"}, markup_pct: 4}
    - {match: {series: "Плиты с электро-духовкой"}, markup_pct: 4}
    - {match: {series: "Духовые шкафы"}, markup_pct: 7}
    - {match: {series: "Стиральные машины с фронтальной загрузкой"}, markup_pct: 3}
    - {match: {series: "Стиральные машины с вертикальной загрузкой"}, markup_pct: 3}
    - {match: {series: "Стиральные машины полуавтоматические центрифуги"}, markup_pct: 3}
    - {match: {series: "Пылесосы колбовые"}, markup_pct: 3}
    - {match: {series: "Пылесосы роботы"}, markup_pct: 2}
    - {match: {series: "Пылесосы с мешком"}, markup_pct: 3}
    - {match: {series: "Водонагреватели накопительные"}, markup_pct: 4}

feed:
  max_active_ads: 600           # ~500 позиций из whitelist
  min_active_ads: 100
  max_drop_fraction: 0.25
  base_tags:
    Category: "Бытовая техника"
    AdType: "Товар приобретен на продажу"
    Condition: "Новое"
  product_type_default: ""
  product_type_map: {}
  ac_type_map: {}
  ac_subtype_map: {}
  vendor_map: {}
  vendor_skip: []

content:
  title_max: 50
  description_max: 7000
  stop_words: []
  descriptions_manifest: "avito-descriptions/manifest.json"
  description_attr: desc_long   # текст собирает адаптер по description_template
  website_link: ""
  website_link_keys: []

