# Профиль «Бытовая техника» (МБТ+КБТ из опт-прайса БытТехОпт) — ОСНОВНОЙ аккаунт Avito,
# тот же, что кондиционеры. Схема: docs/specs/2026-07-04-universal-business-profiles.md
# Запуск (dry-run): python -m avito_bridge --config profiles/appliances.yaml
#
# СТАТУС: ЧЕРНОВИК ДЛЯ DRY-RUN — до боевой публикации требуется решение владельца:
#   1) ФОТО: в прайсе их нет, Avito без Images не публикует (главный блокер);
#   2) наценки: взяты из «наценки по группам товара.xlsx» excel-automation (2–10%),
#      это наценки ПРАЙСА для клиентов — подтвердить, что для Avito такие же;
#   3) GoodsType/GoodsSubType — ДОГАДКИ по дереву Avito (см. урок венков, код 1008):
#      валидируются только реальным отчётом первой загрузки;
#   4) в этом файле НЕТ стабилизаторов и генераторов (их нет в priceopt_*.xls;
#      1 генератор есть в Прайс_ТЛТ_20260716.xlsx — отдельный источник, отдельный шаг);
#   5) все 1626 позиций прайса «Под заказ» — публикуем как товар под заказ.
#
# Слияние с кондиционерным фидом основного аккаунта — отдельный шаг после «добро»:
# у Avito один URL фида на аккаунт, файлы надо объединять при публикации.
profile:
  name: appliances
  source: price_xls             # опт-прайс .xls (ingest/price_xls.py)
  grouping: per_item            # 1 позиция прайса = 1 объявление
  feed_path: feed_out/appliances.xml
  source_options:
    path: "runtime/appliances/current.xls"
    description_template: |-
      {model}

      Новый, в заводской упаковке, официальная гарантия производителя.
      Товар под заказ: срок поставки 1–3 рабочих дня.
      Симферополь: самовывоз или доставка по городу и Крыму.
      Работаем с 2015 года, магазин климатической и бытовой техники.
    # Whitelist групп прайса: МБТ + КБТ (посуду, ножи, мойки, ТВ, электронику
    # и кондиционеры сознательно НЕ берём). 54 группы, ~500 позиций.
    selected_groups:
      # ── МБТ: кухня ──
      - "Электрочайники"
      - "Мясорубки"
      - "Миксеры"
      - "Блендеры"
      - "Аэрогрили"
      - "Мультиварки"
      - "Кофеварки, кофемашины"
      - "Кофемолки"
      - "Тостеры"
      - "Соковыжималки"
      - "Измельчители"
      - "Блинницы"
      - "Бутербродницы и вафельницы"
      - "Грили и электрошашлычницы"
      - "Хлебопечки"
      - "Сушилки для овощей и фруктов"
      - "Ломтерезки"
      - "Духовки настольные"
      - "Плитки настольные"
      - "Весы кухонные"
      - "Микроволновые печи"
      - "Микроволновые печи встраиваемые"
      # ── КБТ: холод ──
      - "Холодильники с нижней морозильной камерой"
      - "Холодильники с верхней морозильной камерой"
      - "Холодильники встраиваемые"
      - "Морозильные камеры"
      - "Морозильные лари"
      # ── КБТ: плиты/духовки/вытяжки ──
      - "Электрические плиты"
      - "Плиты с газовой духовкой"
      - "Плиты с электро-духовкой"
      - "Комбинированные плиты"
      - "Поверхности газовые"
      - "Поверхности электрические"
      - "Поверхности домино"
      - "Духовые шкафы"
      - "Вытяжки"
      - "Вытяжки встраиваемые"
      # ── КБТ: посудомойки ──
      - "Посудомоечные машины встраиваемые"
      - "Посудомойки полноразмерные (60 см)"
      - "Посудомойки узкие (45 см)"
      # ── КБТ: стирка ──
      - "Стиральные машины с фронтальной загрузкой"
      - "Стиральные машины с сушкой"
      - "Стиральные машины с вертикальной загрузкой"
      - "Стиральные машины полуавтоматические центрифуги"
      - "Сушильные автоматы"
      # ── МБТ: дом ──
      - "Пылесосы колбовые"
      - "Пылесосы роботы"
      - "Пылесосы вертикальные"
      - "Пылесосы с мешком"
      - "Утюги и гладильные системы"
      - "Водонагреватели накопительные"
      # ── МБТ: красота (Category, вероятно, другая — см. вопросы владельцу) ──
      - "Фены"
      - "Машинки для стрижки и триммеры"
    # Категорийные теги Avito per группа — ДОГАДКИ (валидация отчётом загрузки).
