pricing:
  rounding: none
  default_markup_pct: 0
  min_margin_abs: 0
  rules:
    - match: {series: "Стабилизаторы напряжения"}
      markup_pct: 20

feed:
  max_active_ads: 70
  min_active_ads: 1
  max_drop_fraction: 0.25
  # Keep the historical Avito IDs of the two archived MBO sets.  The manual
  # entries combine the separately accounted indoor and outdoor blocks.
  ad_id_anchor:
    "manual|item|manual:mbo-07hn1": "pricexls:Ту-00003883"
    "manual|item|manual:mbo-09hn1": "pricexls:Ту-00003885"
  overridable_tags: [Category]
  tag_order:
    - Category
    - GoodsType
    - AdType
    - Condition
    - ProductType
    - GoodsSubCategory
    - GoodsSubType
    - ProductSubType
    - ToolType
    - ToolSubType
    - DeviceType
    - Vendor
    - Model
    - BlenderType
    - Capacity
    - Shelf
    - CaseFlaws
    - InsideFlaws
    - UsefulLife
    - Warranty
    - DeviceWork
    - ListingFee
  base_tags:
    Category: Бытовая техника
    AdType: Товар приобретен на продажу
    Condition: Новое
    # Никогда не списывать деньги с кошелька без отдельного подтверждения.
    ListingFee: Package

content:
  title_max: 50
  description_max: 7000
  condition_notice: "Состояние: новое. Товар не использовался, в заводской упаковке."
