# Черновой профиль бытовой техники из компактного прайса БытТехОпт.
# Источник: «Прайс-лист_ОПТ_без фото_остатки» от 28.07.2026.
# Готовые позиции добавляются в общий фид основного Avito-аккаунта вместе с
# кондиционерами. Без уникальной карточки в фид не попадёт ни одна позиция.

profile:
  name: appliances_btopt
  source: price_xls
  grouping: per_item
  feed_path: feed_out/appliances-btopt.xml
  manual_stop_path: state/manual-stop-main.json
  source_options:
    excluded_product_patterns: ['(?i)\bгенератор\b']
    excluded_device_types: [Генераторы]
    path: runtime/appliances/current.xlsx
    layout: btopt_stock
    section_start: "1. Бытовая техника"
    section_end: "2.1 Стабилизаторы напряжения"
    # «Закуп» — опубликованная цена для всех групп. Вторая колонка
    # «от 100 т.руб/мес» импортируется только для контроля.
    price_column: purchase
    exclude_zero_stock: true
    # Изображения из полного Excel — лишь референсы для контент-завода.
    # Из фида они исключены require_for_publish: нужна уникальная карточка.
    supplier_photo_dir: supplier-thumbnails
    selected_groups:
      - "Холодильники капельные, Defrost"
      - "Морозильные лари"
      - "Инверторные стиральные машины"
      - "Чайники электрические"
      - "Блендеры"
      - "Блендеры настольные(стационарные)"
      - "Мясорубки"
      - "Микроволновые печи, СВЧ"
      - "Кофемашины, кофеварки"
      - "Кофемолки"
      - "Утюги"
      - "Пылесосы"
      - "Колбовые пылесосы"
      - "Фены"
      - "Бритвы"
      - "Машинки для стрижки"
      - "Плитки настольные, элеткро, газ, индукция"
      - "Сушилки для овощей"
      - "Стабилизаторы напряжения"
    # Сверено 30.07.2026 с официальным деревом Avito Autoload:
    # /autoload/v1/user-docs/tree и /node/{slug}/fields.
    # Уровни нельзя сокращать или переставлять: ProductType,
    # GoodsSubCategory и ProductSubType в соответствующих ветках обязательны.
    group_tags:
      "Холодильники капельные, Defrost":
        GoodsType: "Для кухни"
        ProductType: "Холодильники и морозильные камеры"
        GoodsSubType: "Холодильники"
        # Shelf/CaseFlaws/InsideFlaws/UsefulLife/Warranty относятся только
        # к Condition=Б/у и для новых холодильников намеренно не передаются.
      "Морозильные лари":
        GoodsType: "Для кухни"
        ProductType: "Холодильники и морозильные камеры"
        GoodsSubType: "Морозильные камеры и лари"
        ProductSubType: "Ларь"
      "Инверторные стиральные машины":
        GoodsType: "Для дома"
        ProductType: "Стиральные и сушильные машины"
        GoodsSubType: "Стиральные машины"
        DeviceWork: "Включается"
        UsefulLife: "До 3 лет"
        Warranty: "Действует"
