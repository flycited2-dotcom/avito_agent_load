# Профиль «Ритуальные венки и корзинки» (ritualb2b.ru) — ВТОРОЙ бизнес.
# Схема: docs/specs/2026-07-04-universal-business-profiles.md
# Запуск: python -m avito_bridge --config profiles/wreaths.yaml
#
# Аккаунт Avito №2 (профиль 402 499 218): ключи Автозагрузки — в .env
# (AVITO_CLIENT_ID_WREATHS / AVITO_CLIENT_SECRET_WREATHS), в git не кладём.
profile:
  name: wreaths
  source: ritualb2b_site        # products.js сайта (ingest/ritualb2b_site.py)
  grouping: per_item            # 1 товар = 1 объявление, серии не нужны
  feed_path: feed_out/wreaths.xml

cities:
  - {id: "simferopol", name: "Симферополь", avito_location: "Республика Крым, Симферополь"}

pricing:
  rounding: none                # цена сайта = финальная розница, в фид как есть
  default_markup_pct: 0
  min_margin_abs: 0
  rules: []

feed:
  max_active_ads: 100
  # Категория по ЛК владельца (2026-07-15): «Для дома и дачи / Растения /
  # Панно и искусственные растения». ВАЖНО: «Для дома и дачи» — группа сайта,
  # НЕ категория Автозагрузки — первая загрузка вернула код 1008 на все 55
  # объявлений («значения категории нет в списке допустимых»). Category здесь —
  # «Растения», вид товара — GoodsType.
  base_tags:
    Category: "Растения"
    GoodsType: "Панно и искусственные растения"
    AdType: "Товар приобретен на продажу"
    Condition: "Новое"
  product_type_default: ""
  product_type_map: {}
  ac_type_map: {}
  ac_subtype_map: {}
  vendor_map: {}
  vendor_skip: []

content:
  title_max: 50
  description_max: 7000
  stop_words: []
  descriptions_manifest: ""
  description_attr: desc_long   # готовые тексты сайта (descLong), генератор не зовётся
  website_link: ""
  website_link_keys: []

catalog:
  report_category_ids: []
  exclude_title_patterns: []
  force_include: {}
  manual_photos: {}
  selected_series: []           # пусто = публикуем весь каталог сайта (в наличии)

cards:
  enabled: false                # фото товаров с сайта; генер-карточки подключим позже (mode ritual)
  dir: ""
  base_url: ""
  exts: [".jpg", ".jpeg", ".png"]
  require_for_publish: false
  max_images: 10
  supplier_photo_series: []
