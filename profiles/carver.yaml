# CARVER: 23 позиции из прайса со встроенными фотографиями от 15.07.2026.
# Безопасный черновик: категория Avito и розничная наценка ещё не подтверждены,
# поэтому Windows-студия блокирует публикацию этого профиля, а whitelist пуст.
profile:
  name: carver
  source: carver_xlsx
  grouping: per_item
  feed_path: feed_out/carver.xml
  source_options:
    path: "C:/Users/TLT-1/Desktop/Прайс_генераторы_CARVER_фото_15.07.xlsx"
    description_template: |-
      {name}

      {characteristics}

      Новый товар CARVER, в заводской комплектации.
      Симферополь: самовывоз или доставка по городу и Крыму.
      Перед заказом уточните наличие и срок поставки.

cities:
  - {id: "simferopol", name: "Симферополь", avito_location: "Республика Крым, Симферополь"}

pricing:
  # Временно без наценки. Публикация в Studio заблокирована до решения владельца.
  rounding: none
  default_markup_pct: 0
  min_margin_abs: 0
  rules: []

feed:
  max_active_ads: 23
  # Category/GoodsType намеренно не указаны: их надо подтвердить по справочнику Avito.
  base_tags:
    AdType: "Товар приобретен на продажу"
    Condition: "Новое"
  product_type_default: ""
  product_type_map: {}
  ac_type_map: {}
  ac_subtype_map: {}
  vendor_map: {}
  vendor_skip: []

content:
  title_max: 50
  description_max: 7000
  stop_words: []
  descriptions_manifest: ""
  description_attr: desc_long
  website_link: ""
  website_link_keys: []

catalog:
  report_category_ids: []
  exclude_title_patterns: []
  force_include: {}
  manual_photos: {}
  manual_price_override: {}
  manual_card_brief: {}
  # Sentinel делает whitelist непустым, но не совпадает ни с одной позицией.
  selected_series: ["__none__"]

cards:
  enabled: false
  dir: ""
  base_url: ""
  exts: [".jpg", ".jpeg", ".png"]
  require_for_publish: false
  max_images: 10
  supplier_photo_series: []
