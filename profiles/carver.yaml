# CARVER: 23 позиции из прайса со встроенными фотографиями от 15.07.2026.
# Безопасный профиль: путь к локальному прайсу задаётся на каждой машине отдельно,
# а whitelist по умолчанию не публикует ни одного товара.
profile:
  name: carver
  source: carver_xlsx
  grouping: per_item
  feed_path: feed_out/carver.xml
  public_feed_path: "/opt/oasis/staticfiles/avito-feed-carver.xml"
  source_options:
    path: ""
    description_template: |-
      {name}

      {characteristics}

      Новый товар CARVER, в заводской комплектации.
      Симферополь: самовывоз или доставка по городу и Крыму.
      Перед заказом уточните наличие и срок поставки.

cities:
  - {id: "simferopol", name: "Симферополь", avito_location: "Республика Крым, Симферополь"}

pricing:
  # Подтверждённые пользователем параметры для прайса от 15.07.2026.
  rounding: up_to_10
  default_markup_pct: 7
  min_margin_abs: 0
  rules: []
  price_confirmed: false

feed:
  max_active_ads: 23
  # Кандидат из указанного пользователем пути; подтверждается отчётом Avito на одном товаре.
  base_tags:
    AdType: "Товар приобретен на продажу"
    Condition: "Новое"
    Category: "Ремонт и строительство"
    GoodsType: "Инструменты"
    GoodsSubType: "Генераторы"
  product_type_default: ""
  product_type_map: {}
  ac_type_map: {}
  ac_subtype_map: {}
  vendor_map: {}
  vendor_skip: []

content:
  title_max: 50
  description_max: 7000
  stop_words: []
  descriptions_manifest: ""
  description_attr: desc_long
  website_link: ""
  website_link_keys: []

catalog:
  report_category_ids: []
  exclude_title_patterns: []
  force_include: {}
  manual_photos: {}
  manual_price_override: {}
  manual_card_brief: {}
  # Sentinel делает whitelist непустым, но не совпадает ни с одной позицией.
  selected_series: ["__none__"]

cards:
  enabled: false
  dir: ""
  base_url: ""
  exts: [".jpg", ".jpeg", ".png"]
  require_for_publish: false
  max_images: 10
  supplier_photo_series: []
