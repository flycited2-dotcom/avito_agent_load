# CARVER: 10 генераторов из подтверждённой поставки от 18.07.2026.
# Прайс хранится в репозитории, поэтому профиль переносим между рабочими машинами.
profile:
  name: carver
  source: carver_xlsx
  grouping: per_item
  feed_path: feed_out/carver.xml
  public_feed_path: "/opt/oasis/staticfiles/avito-feed-carver.xml"
  source_options:
    path: "data/carver/carver-stock-arrival-2026-07-18.xlsx"
    description_template: |-
      {name}

      {characteristics}

      Новый товар CARVER, в заводской комплектации.
      Симферополь: самовывоз или доставка по городу и Крыму.
      Перед заказом уточните наличие и срок поставки.

cities:
  - {id: "simferopol", name: "Симферополь", avito_location: "Республика Крым, Симферополь"}

pricing:
  # Подтверждённая пользователем наценка для поставки от 18.07.2026.
  rounding: up_to_10
  default_markup_pct: 7
  min_margin_abs: 0
  rules: []
  price_confirmed: true

feed:
  max_active_ads: 10
  # Полный путь категории, предписанный модератором Avito для генераторов.
  base_tags:
    AdType: "Товар приобретен на продажу"
    Condition: "Новое"
    Category: "Ремонт и строительство"
    GoodsType: "Инструменты"
    ToolType: "Силовая, строительная техника и комплектующие"
    ToolSubType: "Устройства электропитания"
    DeviceType: "Генераторы"
  product_type_default: ""
  product_type_map: {}
  ac_type_map: {}
  ac_subtype_map: {}
  vendor_map: {}
  vendor_skip: []

content:
  title_max: 50
  description_max: 7000
  stop_words: []
  descriptions_manifest: ""
  description_attr: desc_long
  website_link: ""
  website_link_keys: []

catalog:
  report_category_ids: []
  exclude_title_patterns: []
  force_include: {}
  manual_photos:
    PPG-1900IS: "https://splithome.ru/static/manual-photos/PPG-1900IS.jpg"
    PPG-4000IS: "https://splithome.ru/static/manual-photos/PPG-4000IS.jpg"
    PPG-5100I: "https://splithome.ru/static/manual-photos/PPG-5100I.jpg"
    PPG-6600ISR: "https://splithome.ru/static/manual-photos/PPG-6600ISR.jpg"
    PPG-8100I: "https://splithome.ru/static/manual-photos/PPG-8100I.jpg"
    PPG-9500IR: "https://splithome.ru/static/manual-photos/PPG-9500IR.jpg"
    PPG-15000IR: "https://splithome.ru/static/manual-photos/PPG-15000IR.jpg"
    PPG-15000IVR: "https://splithome.ru/static/manual-photos/PPG-15000IVR.jpg"
    PPG-2000IS: "https://splithome.ru/static/manual-photos/PPG-2000IS.jpg"
    PPG-3900: "https://splithome.ru/static/manual-photos/PPG-3900.jpg"
  manual_price_override: {}
  manual_card_brief: {}
  selected_series:
    - "carver_xlsx|item|carver:PPG-1900IS"
    - "carver_xlsx|item|carver:PPG-4000IS"
    - "carver_xlsx|item|carver:PPG-5100I"
    - "carver_xlsx|item|carver:PPG-6600ISR"
    - "carver_xlsx|item|carver:PPG-8100I"
    - "carver_xlsx|item|carver:PPG-9500IR"
    - "carver_xlsx|item|carver:PPG-15000IR"
    - "carver_xlsx|item|carver:PPG-15000IVR"
    - "carver_xlsx|item|carver:PPG-2000IS"
    - "carver_xlsx|item|carver:PPG-3900"

cards:
